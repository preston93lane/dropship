name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Deno type-check Edge Functions
        run: npm run check:edge
      - name: Agents mirror is up to date
        run: |
          npm run agents:sync-claude-code
          git diff --exit-code .claude/agents || (echo "Run npm run agents:sync-claude-code and commit" && exit 1)
