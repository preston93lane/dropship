<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .top { position: absolute; top: 6vh; left: 6vw; right: 22vw; }
  .badge { position: absolute; top: 5vh; right: 5vw; }
  .product { position: absolute; left: 10vw; right: 10vw; width: 80vw; top: 28vh; height: 40vh; }
  .chips { position: absolute; left: 6vw; bottom: 17vh; display: flex; flex-direction: column; gap: 1.6vh; align-items: flex-start; }
  .cta { position: absolute; left: 6vw; right: 6vw; bottom: 5vh; }
</style></head>
<body><div class="ad">
  <img class="bg" data-src="background" alt="">
  <div class="shade-top"></div><div class="shade-bottom"></div>
  <div class="top"><div class="headline" data-html="headline"></div><div class="subhead" style="margin-top:1.6vh" data-text="subhead"></div></div>
  <div class="badge" data-html="badge"></div>
  <img class="product" data-src="product" alt="">
  <div class="chips" data-list="benefits"></div>
  <div class="cta" data-text="cta"></div>
</div>
<script>
(() => {
  const P = window.PROPS || {};
  const chips = document.querySelector('[data-list="benefits"]');
  (P.benefits || []).slice(0, 4).forEach(b => { const c = document.createElement('div'); c.className = 'chip'; c.innerHTML = '<span class="tick">✓</span>'; c.append(b); chips.append(c); });
  if (!P.background) document.querySelector('.bg').remove();
})();
</script>
</body></html>
