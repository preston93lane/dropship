<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .half { position: absolute; left: 0; right: 0; height: 50vh; overflow: hidden; }
  .half img { width: 100%; height: 100%; object-fit: cover; }
  .problem { top: 0; } .problem img { filter: grayscale(.85) brightness(.55); }
  .fix { bottom: 0; background: var(--bg); }
  .label { position: absolute; left: 6vw; display: inline-flex; gap: 2vw; align-items: center; font-weight: 900; font-size: 4.6vw; padding: 1.6vw 3.4vw; border-radius: 999px; }
  .problem .label { top: 4vh; background: var(--bad); color: #fff; }
  .fix .label { top: 3vh; background: var(--good); color: #fff; }
  .line { position: absolute; left: 6vw; right: 18vw; font-weight: 900; font-size: 7.4vw; line-height: 1.04; letter-spacing: -0.02em; text-wrap: balance; }
  .problem .line { bottom: 4vh; }
  .fix .line { top: 11vh; right: 46vw; font-size: 6.6vw; }
  .fix .product { position: absolute; right: 4vw; top: 4vh; width: 46vw; height: 40vh; }
  .cta { position: absolute; left: 6vw; bottom: 5vh; font-size: 4.6vw; padding: 2.6vw 5vw; }
</style></head>
<body><div class="ad">
  <div class="half problem"><img data-src="problemImage" alt=""><span class="label">✗ <span data-text="problemLabel"></span></span><div class="line" data-html="problem"></div></div>
  <div class="half fix"><span class="label">✓ <span data-text="fixLabel"></span></span><div class="line" data-html="fix"></div><img class="product" data-src="product" alt=""><div class="cta" data-text="cta"></div></div>
</div><script></script></body></html>
